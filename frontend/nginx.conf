server {
    listen 80;
    server_name _;

    # La API acepta hasta 100 MB; sin esta directiva nginx rechaza a 1 MB.
    client_max_body_size 100m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: todas las rutas caen en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso hacia la API.
    # El resolver de Docker (127.0.0.11) permite resolver "api" en runtime:
    # nginx arranca aunque la API aún no esté disponible y se recupera solo.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}